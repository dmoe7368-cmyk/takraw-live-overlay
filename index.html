<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Takraw Live Overlay</title>
  <link rel="stylesheet" href="css/overlay.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <!-- ညာဘက်ထောင့် Circle Logo -->
  <div class="top-right-badge">
    <img src="assets/logo.png" alt="Logo" class="circle-logo" onerror="this.style.display='none'">
  </div>

  <!-- အောက်ခြေ Takraw Scoreboard -->
  <div class="scoreboard-wrapper">
    <div class="takraw-board" id="board" style="display: none;">
      
      <!-- Match Meta (ကြေးစား/ပြိုင်ပွဲ ၊ အဖိုက်/ပါစား ၊ Set & Due) -->
      <div class="match-meta-box">
        <div class="meta-row">
          <span class="meta-tag" id="meta-type">ကြေးစား</span>
          <span class="meta-tag sub" id="meta-style">အဖိုက် / အနိုက်</span>
        </div>
        <div class="set-row">
          <span class="set-text" id="current-set">SET 1</span>
          <span class="due-badge" id="due-badge" style="display: none;">DUE POINT</span>
        </div>
      </div>

      <!-- Home Team -->
      <div class="team-side home-side">
        <span class="serve-ball" id="home-serve"></span>
        <span class="team-name" id="home-name">မြန်မာ</span>
        
        <!-- Set Win Frame သီးသန့် -->
        <div class="set-win-frame" title="Sets Won">
          <span class="set-win-label">SET</span>
          <span class="set-win-val" id="home-sets">0</span>
        </div>

        <!-- ခု ခတ်နေသော ပင်မ ရမှတ် (Current Points) -->
        <div class="current-pts-box">
          <span class="pts-val" id="home-pts">0</span>
        </div>
      </div>

      <div class="score-divider">:</div>

      <!-- Away Team -->
      <div class="team-side away-side">
        <!-- ခု ခတ်နေသော ပင်မ ရမှတ် (Current Points) -->
        <div class="current-pts-box">
          <span class="pts-val" id="away-pts">0</span>
        </div>

        <!-- Set Win Frame သီးသန့် -->
        <div class="set-win-frame" title="Sets Won">
          <span class="set-win-label">SET</span>
          <span class="set-win-val" id="away-sets">0</span>
        </div>

        <span class="team-name" id="away-name">ထိုင်း</span>
        <span class="serve-ball" id="away-serve"></span>
      </div>

    </div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/overlay.js"></script>
</body>
</html>
