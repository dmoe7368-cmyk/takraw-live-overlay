<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Takraw Live Scoreboard Overlay</title>
  <link rel="stylesheet" href="css/overlay.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <!-- ညာဘက်အပေါ်ထောင့် Circle Logo -->
  <div class="top-right-badge">
    <img src="assets/logo.png" alt="Logo" class="circle-logo" onerror="this.style.display='none'">
  </div>

  <!-- ဘယ်ဘက် အပေါ်ထောင့် Scorebug Wrapper -->
  <div class="scorebug-wrapper">
    <div class="scorebug-card" id="board">
      
      <!-- အပေါ်ဘက် Header Bar (Tags & Match Meta) -->
      <div class="scorebug-header">
        <div class="gold-tags">
          <span class="gold-badge" id="meta-type">ကြေးစား</span>
          <span class="gold-badge stage" id="meta-stage" style="display: none;">Quarter</span>
          <span class="gold-badge height" id="meta-height" style="display: none;">ပိုက်: ၅'၂"</span>
          <span class="gold-badge sub" id="meta-style">ဝါးစား / အောက်ခံ</span>
        </div>
        <div class="set-meta">
          <span class="set-text" id="current-set">SET 1</span>
          <span class="due-pill" id="due-badge" style="display: none;">DUE</span>
        </div>
      </div>

      <!-- ပင်မ အမှတ် Table Body -->
      <div class="scorebug-table">
        
        <!-- SET နှင့် PTS ခေါင်းစဉ်တန်း -->
        <div class="table-header-row">
          <div class="th-name"></div>
          <div class="th-box th-set">SET</div>
          <div class="th-box th-pts">PTS</div>
        </div>

        <!-- အပေါ်သင်း (Home Team) -->
        <div class="team-row" id="home-row">
          <div class="serve-slot">
            <span class="serve-ball"></span>
          </div>
          <div class="team-name-box">
            <span class="team-name-text" id="home-name">မြန်မာ</span>
          </div>
          <div class="set-win-box">
            <span class="set-num" id="home-sets">0</span>
          </div>
          <div class="pts-box">
            <span class="pts-num" id="home-pts">0</span>
          </div>
        </div>

        <div class="team-divider"></div>

        <!-- အောက်သင်း (Away Team) -->
        <div class="team-row" id="away-row">
          <div class="serve-slot">
            <span class="serve-ball"></span>
          </div>
          <div class="team-name-box">
            <span class="team-name-text" id="away-name">ထိုင်း</span>
          </div>
          <div class="set-win-box">
            <span class="set-num" id="away-sets">0</span>
          </div>
          <div class="pts-box">
            <span class="pts-num" id="away-pts">0</span>
          </div>
        </div>

      </div>

    </div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/overlay.js"></script>
</body>
</html>
